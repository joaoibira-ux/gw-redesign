<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Relatório de Ponto · GW</title>
  <link rel="apple-touch-icon" href="../Logo-gw.png" />

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f1;
      color: #1a2e1e;
    }
    body { display: flex; flex-direction: column; }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      background: #1a3322;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      flex-shrink: 0;
    }
    header a {
      display: flex; align-items: center; line-height: 0;
      text-decoration: none;
    }
    header img {
      height: 36px; width: 36px;
      object-fit: contain; border-radius: 8px;
    }
    .h-title {
      flex: 1;
      font-size: 1rem; font-weight: 700;
      white-space: nowrap;
    }
    .h-versao {
      font-size: 0.6rem; font-weight: 400;
      color: rgba(255,255,255,0.45);
      text-align: right;
    }

    /* ── PERÍODO ─────────────────────────────────────────── */
    .periodo-bar {
      background: #1a3322;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px 10px;
      flex-shrink: 0;
      border-bottom: 2px solid #a5d6a7;
    }
    .periodo-btn {
      background: rgba(165,214,167,0.15);
      border: 1px solid rgba(165,214,167,0.25);
      color: #a5d6a7;
      font-size: 1.1rem;
      width: 34px; height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .periodo-btn:active { background: rgba(165,214,167,0.3); }
    .periodo-label {
      flex: 1;
      text-align: center;
      color: #a5d6a7;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: capitalize;
    }
    .periodo-total {
      font-size: 0.7rem;
      color: rgba(165,214,167,0.65);
      text-align: right;
      white-space: nowrap;
    }

    /* ── CONTEÚDO ─────────────────────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }

    /* ── ESTADOS ─────────────────────────────────────────── */
    .estado {
      text-align: center;
      padding: 48px 24px;
      color: #6a9a72;
      font-size: 0.88rem;
    }
    .estado.erro { color: #c62828; }

    /* ── TABELA ─────────────────────────────────────────── */
    .tabela-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 320px;
      background: #fff;
    }
    thead tr { background: #1a3322; }
    th {
      padding: 9px 10px;
      text-align: left;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: #a5d6a7;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #e8f0e9; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: #f5fbf5; }
    td {
      padding: 8px 10px;
      color: #2e3a2f;
      vertical-align: middle;
    }
    .td-nome  { font-weight: 600; font-size: 0.82rem; }
    .td-cargo { font-size: 0.68rem; color: #6a8a72; display: block; font-weight: 400; }
    .td-data  { white-space: nowrap; color: #4a6a50; font-size: 0.78rem; }
    .td-entrada { color: #2e7d32; font-weight: 700; white-space: nowrap; }
    .td-saida   { color: #b84d00; font-weight: 700; white-space: nowrap; }
    .td-vazio   { color: #c0c0c0; }

    /* ── SEPARADOR DE DATA ───────────────────────────────── */
    .tr-data-sep td {
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 5px 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── OCORRÊNCIAS ─────────────────────────────────────── */
    .btn-ocorrencia {
      background: #c62828; color: #fff; border: none;
      border-radius: 8px; padding: 7px 10px;
      font-size: 0.75rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .tr-ocorrencia { background: #ffebee !important; }
    .oc-badge {
      display: inline-block; background: #c62828; color: #fff;
      font-size: 0.66rem; font-weight: 700; padding: 2px 7px; border-radius: 10px;
    }
    .oc-motivo { display: block; font-size: 0.7rem; color: #8a3a3a; margin-top: 3px; }
    .oc-del { background: none; border: none; color: #c0a0a0; font-size: 0.9rem; cursor: pointer; float: right; }
    .modal-ov {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
    }
    .modal-bx {
      background: #fff; border-radius: 16px; padding: 20px 18px;
      width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
    }
    .modal-bx h3 { font-size: 1rem; color: #c62828; margin-bottom: 12px; }
    .modal-bx label { display: block; font-size: 0.7rem; font-weight: 700; color: #888; text-transform: uppercase; margin: 10px 0 4px; }
    .modal-bx select, .modal-bx input, .modal-bx textarea {
      width: 100%; padding: 9px 10px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 0.9rem; font-family: inherit;
    }
    .oc-tipos { display: flex; gap: 8px; }
    .oc-tipos label { flex: 1; text-transform: none; font-size: 0.85rem; color: #333; border: 1.5px solid #ddd; border-radius: 8px; padding: 9px; margin: 0; cursor: pointer; }
    .oc-tipos input { width: auto; margin-right: 6px; }
    .oc-aviso { font-size: 0.72rem; color: #777; margin-top: 10px; }
    .modal-acoes { display: flex; gap: 8px; margin-top: 16px; }
    .modal-acoes button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .btn-cancel-oc { background: #eee; color: #555; }
    .btn-ok-oc { background: #c62828; color: #fff; }
    .btn-ok-oc:disabled { opacity: 0.5; }
  </style>
</head>
<body>

<header>
  <a href="https://sistema.gwrevestimentos.com.br/" title="Voltar ao menu">
    <img src="../Logo-gw.png" alt="GW" draggable="false" />
  </a>
  <span class="h-title">Relatório de Ponto</span>
  <button class="btn-ocorrencia" id="btn-ocorrencia" style="display:none" onclick="abrirOcorrencia()">⚠️ Falta/Suspensão</button>
  <span class="h-versao">v1.2</span>
</header>

<div class="modal-ov" id="modal-oc" onclick="if(event.target===this) fecharOcorrencia()">
  <div class="modal-bx">
    <h3>⚠️ Registrar falta ou suspensão</h3>
    <label for="oc-func">Funcionário</label>
    <select id="oc-func"></select>
    <label for="oc-data">Data</label>
    <input type="date" id="oc-data" />
    <label>Tipo</label>
    <div class="oc-tipos">
      <label><input type="radio" name="oc-tipo" value="falta" checked />Falta</label>
      <label><input type="radio" name="oc-tipo" value="suspensao" />Suspensão</label>
    </div>
    <label for="oc-motivo">Motivo</label>
    <textarea id="oc-motivo" rows="3" placeholder="Ex: faltou sem avisar / chegou alcoolizado..."></textarea>
    <p class="oc-aviso">O dia será descontado (passagem e diária) e a advertência vai na hora pro WhatsApp do funcionário, com cópia pro João no Telegram.</p>
    <div class="modal-acoes">
      <button class="btn-cancel-oc" onclick="fecharOcorrencia()">Cancelar</button>
      <button class="btn-ok-oc" id="btn-ok-oc" onclick="confirmarOcorrencia()">Registrar e enviar</button>
    </div>
  </div>
</div>

<div class="periodo-bar">
  <button class="periodo-btn" onclick="mudarMes(-1)" aria-label="Mês anterior">‹</button>
  <div class="periodo-label" id="periodo-label">—</div>
  <button class="periodo-btn" onclick="mudarMes(1)" aria-label="Próximo mês">›</button>
  <div class="periodo-total" id="periodo-total"></div>
</div>

<div class="content">
  <div class="estado" id="estado">Carregando...</div>
  <div class="tabela-wrap" id="tabela-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Data</th>
          <th>Entrada</th>
          <th>Saída</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const VERSAO = '1.2';
const PIN_ATUAL = sessionStorage.getItem('gw_pin') || '';
const PODE_REGISTRAR_OCORRENCIA = PIN_ATUAL === '2248' || PIN_ATUAL === '1176';

const firebaseConfig = {
  apiKey:            "AIzaSyBaqROPsywPgtKjQU7cs1ke1WaqDFhWwn0",
  authDomain:        "sistema-gw-36566.firebaseapp.com",
  projectId:         "sistema-gw-36566",
  storageBucket:     "sistema-gw-36566.firebasestorage.app",
  messagingSenderId: "472820177992",
  appId:             "1:472820177992:web:2e1b98c9f6ac3a823d0c7d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MESES = [
  'Janeiro','Fevereiro','Março','Abril','Maio','Junho',
  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'
];

let anoAtual = new Date().getFullYear();
let mesAtual = new Date().getMonth();

function mudarMes(delta) {
  mesAtual += delta;
  if (mesAtual < 0)  { mesAtual = 11; anoAtual--; }
  if (mesAtual > 11) { mesAtual = 0;  anoAtual++; }
  carregar();
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtHora(date) {
  return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function fmtDataCurta(date) {
  return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function fmtDataSep(date) {
  return date.toLocaleDateString('pt-BR', {
    weekday: 'short', day: '2-digit', month: '2-digit'
  });
}

function setEstado(msg, erro = false) {
  const el = document.getElementById('estado');
  el.textContent = msg;
  el.className = 'estado' + (erro ? ' erro' : '');
  el.style.display = 'block';
  document.getElementById('tabela-wrap').style.display = 'none';
  document.getElementById('periodo-total').textContent = '';
}

async function carregar() {
  document.getElementById('periodo-label').textContent = `${MESES[mesAtual]} ${anoAtual}`;
  setEstado('Carregando...');

  const inicio = new Date(anoAtual, mesAtual, 1);
  const fim    = new Date(anoAtual, mesAtual + 1, 1);

  try {
    const isoIni = `${anoAtual}-${String(mesAtual + 1).padStart(2, '0')}-01`;
    const isoFim = `${fim.getFullYear()}-${String(fim.getMonth() + 1).padStart(2, '0')}-01`;
    const [snap, ocSnap] = await Promise.all([
      db.collection('pontos')
        .where('timestamp', '>=', firebase.firestore.Timestamp.fromDate(inicio))
        .where('timestamp', '<',  firebase.firestore.Timestamp.fromDate(fim))
        .orderBy('timestamp', 'asc')
        .get(),
      db.collection('ocorrencias')
        .where('dataISO', '>=', isoIni)
        .where('dataISO', '<', isoFim)
        .get()
    ]);

    if (snap.empty && ocSnap.empty) { setEstado('Nenhum registro neste período.'); return; }

    // Agrupa por (funcionarioId, data-dia)
    const mapa = new Map();
    snap.docs.forEach(doc => {
      const d  = doc.data();
      const ts = d.timestamp ? d.timestamp.toDate() : new Date();
      const diaKey = `${d.funcionarioId || d.funcionarioNome}|${ts.toDateString()}`;
      if (!mapa.has(diaKey)) {
        mapa.set(diaKey, {
          nome:   d.funcionarioNome || '—',
          dataTs: ts,
          entrada: null,
          saida:   null
        });
      }
      const item = mapa.get(diaKey);
      if (d.tipo === 'entrada') item.entrada = ts;
      if (d.tipo === 'saida')   item.saida   = ts;
    });

    ocSnap.docs.forEach(doc => {
      const o = doc.data();
      const [a, m, d] = o.dataISO.split('-').map(Number);
      mapa.set('oc|' + doc.id, {
        nome: o.funcionarioNome || '—',
        dataTs: new Date(a, m - 1, d, 23, 59),
        ocorrencia: { id: doc.id, tipo: o.tipo, motivo: o.motivo, whats: o.whatsappEnviado }
      });
    });

    // Ordena por data asc, depois por nome
    const linhas = [...mapa.values()].sort((a, b) => {
      const dt = a.dataTs - b.dataTs;
      if (dt !== 0) return dt;
      return (a.nome || '').localeCompare(b.nome || '', 'pt-BR');
    });

    // Monta HTML com separadores de data
    let html = '';
    let ultimaData = '';
    linhas.forEach(l => {
      const dataKey = l.dataTs.toDateString();
      if (dataKey !== ultimaData) {
        ultimaData = dataKey;
        html += `<tr class="tr-data-sep"><td colspan="4">${esc(fmtDataSep(l.dataTs))}</td></tr>`;
      }
      if (l.ocorrencia) {
        const oc = l.ocorrencia;
        const del = PODE_REGISTRAR_OCORRENCIA ? `<button class="oc-del" onclick="excluirOcorrencia('${oc.id}')" title="Excluir">✕</button>` : '';
        html += `
          <tr class="tr-ocorrencia">
            <td class="td-nome">${esc(l.nome)}</td>
            <td class="td-data">${fmtDataCurta(l.dataTs)}</td>
            <td colspan="2">${del}<span class="oc-badge">${oc.tipo === 'suspensao' ? 'SUSPENSÃO' : 'FALTA'}</span>${oc.whats === false ? ' <span class="oc-badge" style="background:#888">WhatsApp não enviado</span>' : ''}<span class="oc-motivo">${esc(oc.motivo || '')}</span></td>
          </tr>`;
        return;
      }
      const entHtml = l.entrada
        ? `<td class="td-entrada">${fmtHora(l.entrada)}</td>`
        : `<td class="td-vazio">—</td>`;
      const saiHtml = l.saida
        ? `<td class="td-saida">${fmtHora(l.saida)}</td>`
        : `<td class="td-vazio">—</td>`;
      html += `
        <tr>
          <td class="td-nome">${esc(l.nome)}</td>
          <td class="td-data">${fmtDataCurta(l.dataTs)}</td>
          ${entHtml}
          ${saiHtml}
        </tr>`;
    });

    document.getElementById('tbody').innerHTML = html;
    document.getElementById('estado').style.display = 'none';
    document.getElementById('tabela-wrap').style.display = 'block';
    document.getElementById('periodo-total').textContent = `${linhas.length} registro${linhas.length !== 1 ? 's' : ''}`;
  } catch(e) {
    setEstado('Erro ao carregar: ' + e.message, true);
  }
}

// ── Falta/suspensão com advertência (PIN 2248 ou 1176) ──────────────────
if (PODE_REGISTRAR_OCORRENCIA) document.getElementById('btn-ocorrencia').style.display = '';

async function abrirOcorrencia() {
  const snap = await db.collection('funcionarios').get();
  const ativos = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .filter(f => f.ativo !== false)
    .sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  document.getElementById('oc-func').innerHTML = '<option value="">Selecionar...</option>' +
    ativos.map(f => `<option value="${f.id}">${esc(f.nome)}${f.telefone ? '' : ' (sem telefone)'}</option>`).join('');
  const hoje = new Date();
  document.getElementById('oc-data').value =
    `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
  document.getElementById('oc-motivo').value = '';
  document.querySelector('input[name="oc-tipo"][value="falta"]').checked = true;
  document.getElementById('modal-oc').style.display = 'flex';
}

function fecharOcorrencia() {
  document.getElementById('modal-oc').style.display = 'none';
}

async function confirmarOcorrencia() {
  const funcSel = document.getElementById('oc-func');
  const funcionarioId = funcSel.value;
  const dataISO = document.getElementById('oc-data').value;
  const tipo = document.querySelector('input[name="oc-tipo"]:checked').value;
  const motivo = document.getElementById('oc-motivo').value.trim();
  if (!funcionarioId) { alert('Selecione o funcionário.'); return; }
  if (!dataISO) { alert('Informe a data.'); return; }
  if (!motivo) { alert('Informe o motivo.'); return; }

  const nome = funcSel.options[funcSel.selectedIndex].text;
  const [a, m, d] = dataISO.split('-');
  if (!confirm(`Registrar ${tipo === 'falta' ? 'FALTA' : 'SUSPENSÃO'} de ${nome} em ${d}/${m}/${a} e enviar a advertência no WhatsApp dele?`)) return;

  const btn = document.getElementById('btn-ok-oc');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const fn = firebase.functions().httpsCallable('registrarOcorrencia');
    const res = await fn({ pin: PIN_ATUAL, funcionarioId, tipo, dataISO, motivo });
    fecharOcorrencia();
    alert(res.data.whatsappEnviado
      ? 'Registrado e advertência enviada no WhatsApp do funcionário. Cópia enviada no Telegram.'
      : 'Registrado, mas o WhatsApp NÃO foi enviado (' + (res.data.erroWhatsapp || 'erro') + '). Cópia enviada no Telegram.');
    carregar();
  } catch (e) {
    alert('Erro: ' + (e.message || e));
  } finally {
    btn.disabled = false; btn.textContent = 'Registrar e enviar';
  }
}

async function excluirOcorrencia(id) {
  const senha = prompt('EXCLUIR ESTA OCORRÊNCIA?\n\n(a mensagem já enviada não é apagada; o dia volta a contar normalmente)\n\nDigite a senha:');
  if (senha === null) return;
  if (senha !== '2248' && senha !== '1176') { alert('Senha incorreta.'); return; }
  await db.collection('ocorrencias').doc(id).delete();
  carregar();
}

carregar();
</script>
<script src="../agente.js"></script>
<script src="../bfcache-fix.js"></script>
</body>
</html>
